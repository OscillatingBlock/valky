[package]
name = "valky"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = { version = "1.12.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
